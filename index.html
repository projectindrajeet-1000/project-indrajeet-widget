<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Indrajeet — Vivid Glow Floor Overlay</title>

<style>
  :root{
    --white:#ffffff;
    --muted:rgba(255,255,255,.92);

    /* More vivid logo-inspired accents */
    --cyan:#19e6ff;
    --violet:#9d4dff;
    --pink:#ff3bd4;
    --orange:#ff9a1f;
    --gold:#ffd24a;

    --baseOpacity:.98;
    --backingOpacity:.20;
    --glowStrength:1.28;
  }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent !important;
    font-family:Arial, Helvetica, sans-serif;
  }

  body{
    position:relative;
  }

  #floorOverlay{
    position:absolute;
    left:26px;
    bottom:28px;
    width:max-content;
    min-width:660px;

    color:var(--white);
    background:transparent !important;

    transform-origin:left bottom;
    transform:
      perspective(900px)
      rotateX(58deg)
      rotateZ(-2deg);

    opacity:var(--baseOpacity);

    backface-visibility:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
    isolation:isolate;
  }

  /* faint translucent surface lift */
  #floorOverlay::before{
    content:"";
    position:absolute;
    left:-24px;
    top:-18px;
    width:910px;
    height:315px;

    border-radius:26px;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,calc(var(--backingOpacity) * .55)),
        rgba(255,255,255,calc(var(--backingOpacity) * .16))
      );

    box-shadow:
      0 0 34px rgba(255,255,255,calc(var(--backingOpacity) * .22)),
      inset 0 0 1px rgba(255,255,255,.20);

    filter:blur(1.2px);
    z-index:-3;
    pointer-events:none;
  }

  /* multicolour bloom beneath the HUD */
  #floorOverlay::after{
    content:"";
    position:absolute;
    left:20px;
    top:142px;
    width:790px;
    height:190px;

    border-radius:50%;

    background:
      radial-gradient(
        ellipse at 22% 52%,
        rgba(25,230,255,.28) 0%,
        rgba(25,230,255,.13) 25%,
        rgba(25,230,255,0) 52%
      ),
      radial-gradient(
        ellipse at 50% 52%,
        rgba(157,77,255,.26) 0%,
        rgba(157,77,255,.12) 27%,
        rgba(157,77,255,0) 55%
      ),
      radial-gradient(
        ellipse at 78% 52%,
        rgba(255,154,31,.25) 0%,
        rgba(255,154,31,.11) 27%,
        rgba(255,154,31,0) 56%
      );

    filter:blur(24px);
    z-index:-2;
    pointer-events:none;
  }

  .title{
    font-size:26px;
    line-height:1;
    font-weight:700;
    letter-spacing:7px;
    text-transform:uppercase;
    white-space:nowrap;

    text-shadow:
      0 0 calc(9px * var(--glowStrength)) rgba(255,255,255,.90),
      0 0 calc(18px * var(--glowStrength)) rgba(25,230,255,.28),
      0 3px 4px rgba(0,0,0,.42);
  }

  .accent{
    width:360px;
    height:4px;
    margin:14px 0 16px;
    border-radius:999px;

    background:linear-gradient(
      90deg,
      var(--cyan) 0%,
      var(--violet) 38%,
      var(--pink) 62%,
      var(--orange) 82%,
      var(--gold) 100%
    );

    box-shadow:
      0 0 calc(11px * var(--glowStrength)) rgba(25,230,255,.65),
      0 0 calc(16px * var(--glowStrength)) rgba(157,77,255,.34),
      0 0 calc(18px * var(--glowStrength)) rgba(255,154,31,.24);
  }

  .meta{
    display:flex;
    align-items:baseline;
    gap:42px;

    color:var(--muted);
    font-size:24px;
    line-height:1;
    font-weight:700;
    letter-spacing:1.5px;
    white-space:nowrap;

    text-shadow:
      0 0 calc(8px * var(--glowStrength)) rgba(255,255,255,.78),
      0 0 calc(16px * var(--glowStrength)) rgba(25,230,255,.18),
      0 3px 4px rgba(0,0,0,.38);
  }

  .meta strong{
    color:var(--white);
    font-weight:800;
  }

  .time{
    margin-top:20px;

    font-size:112px;
    line-height:.86;
    font-weight:900;
    letter-spacing:3px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;

    text-shadow:
      0 0 calc(14px * var(--glowStrength)) rgba(255,255,255,.98),
      0 0 calc(28px * var(--glowStrength)) rgba(25,230,255,.34),
      0 0 calc(42px * var(--glowStrength)) rgba(157,77,255,.18),
      0 4px 6px rgba(0,0,0,.28);
  }

  @media (max-width:800px){
    #floorOverlay{
      left:16px;
      bottom:18px;
      min-width:520px;
    }

    #floorOverlay::before{
      width:710px;
      height:245px;
      left:-16px;
      top:-14px;
    }

    #floorOverlay::after{
      width:610px;
      height:140px;
      left:22px;
      top:118px;
    }

    .title{
      font-size:20px;
      letter-spacing:5px;
    }

    .accent{
      width:280px;
      height:3px;
      margin:11px 0 13px;
    }

    .meta{
      gap:28px;
      font-size:19px;
    }

    .time{
      margin-top:15px;
      font-size:82px;
    }
  }
</style>
</head>

<body>

<div id="floorOverlay">
  <div class="title">Project Indrajeet</div>
  <div class="accent"></div>

  <div class="meta">
    <div>DAY <strong id="day">1</strong></div>
    <div><strong id="progress">0</strong> / 1000 H</div>
  </div>

  <div class="time" id="elapsed">00:00:00</div>
</div>

<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const floor = document.getElementById("floorOverlay");
  const root = document.documentElement;

  function numberParam(name, fallback, min, max){
    const raw = parseFloat(params.get(name));
    if (!Number.isFinite(raw)) return fallback;
    return Math.max(min, Math.min(max, raw));
  }

  const dayRaw = parseInt(params.get("day") || "1", 10);
  const day = Number.isFinite(dayRaw) && dayRaw > 0 ? dayRaw : 1;

  const baseRaw = parseFloat(params.get("base") || "0");
  const baseHours = Number.isFinite(baseRaw) && baseRaw >= 0 ? baseRaw : 0;

  document.getElementById("day").textContent = String(day);

  const tilt = numberParam("tilt", 58, 20, 78);
  const roll = numberParam("roll", -2, -20, 20);
  const perspective = numberParam("perspective", 900, 350, 2000);
  const opacity = numberParam("opacity", 0.98, 0.20, 1);

  floor.style.transform =
    `perspective(${perspective}px) rotateX(${tilt}deg) rotateZ(${roll}deg)`;

  floor.style.opacity = opacity;

  const backing = numberParam("bgopacity", 0.20, 0, 0.7);
  const glow = numberParam("glow", 1.28, 0, 3);

  root.style.setProperty("--backingOpacity", backing);
  root.style.setProperty("--glowStrength", glow);

  function getStartMs(){
    const startParam = params.get("start");

    if (!startParam){
      return Date.now();
    }

    const parts = startParam.split(":").map(Number);

    if (
      parts.length < 2 ||
      parts.some(value => !Number.isFinite(value))
    ){
      return Date.now();
    }

    const now = new Date();

    const h = Math.max(0, Math.min(23, parts[0]));
    const m = Math.max(0, Math.min(59, parts[1]));
    const s = Math.max(0, Math.min(59, parts[2] || 0));

    return new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      h, m, s, 0
    ).getTime();
  }

  const startMs = getStartMs();

  function formatElapsed(totalSeconds){
    totalSeconds = Math.max(0, Math.floor(totalSeconds));

    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;

    return (
      String(h).padStart(2, "0") + ":" +
      String(m).padStart(2, "0") + ":" +
      String(s).padStart(2, "0")
    );
  }

  function formatProgress(hours){
    const rounded = Math.round(hours * 100) / 100;
    return String(parseFloat(rounded.toFixed(2)));
  }

  function update(){
    const elapsedSeconds =
      Math.max(0, (Date.now() - startMs) / 1000);

    document.getElementById("elapsed").textContent =
      formatElapsed(elapsedSeconds);

    const liveProgress = Math.min(
      1000,
      baseHours + elapsedSeconds / 3600
    );

    document.getElementById("progress").textContent =
      formatProgress(liveProgress);
  }

  update();
  setInterval(update, 250);
})();
</script>

</body>
</html>
