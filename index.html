<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Project Indrajeet — Sitting Live HUD</title>

<!-- PRISM/GitHub Pages live overlay.
     URL example:
     ?day=1&base=0&start=00:00:00

     base = completed meditation HOURS before this session.
     start = timer offset when the page loads.

     Optional sitting-floor corner overrides:
     tlx,tly,trx,try,brx,bry,blx,bly
     Values are normalized 0..1 of the live frame.
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap');

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
  }

  body {
    position: relative;
    font-family: "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
  }

  #hud {
    position: absolute;
    left: 0;
    top: 0;

    /* EXACT design canvas from the standing renderer */
    width: 1400px;
    height: 780px;

    transform-origin: 0 0;
    transform-style: preserve-3d;
    will-change: transform;

    pointer-events: none;
    background: transparent;
  }

  .white {
    color: rgba(255,255,255,.98);
    text-shadow:
      0 0 7px rgba(255,255,255,.22),
      0 0 16px rgba(255,255,255,.12);
  }

  #title {
    position: absolute;
    left: 80px;
    top: 72px;

    font-size: 92px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: 9px;
    white-space: nowrap;
  }

  #accentGlow {
    position: absolute;
    left: 97px;
    top: 205px;
    width: 1120px;
    height: 10px;

    background: linear-gradient(
      90deg,
      rgb(0,229,255) 0%,
      rgb(115,78,255) 36%,
      rgb(255,62,176) 68%,
      rgb(255,174,55) 100%
    );

    filter: blur(17px);
    opacity: .62;
  }

  #accent {
    position: absolute;
    left: 97px;
    top: 205px;
    width: 1120px;
    height: 10px;

    background: linear-gradient(
      90deg,
      rgb(0,229,255) 0%,
      rgb(115,78,255) 36%,
      rgb(255,62,176) 68%,
      rgb(255,174,55) 100%
    );
  }

  #day {
    position: absolute;
    left: 105px;
    top: 268px;

    font-size: 92px;
    line-height: 1;
    font-weight: 700;
    white-space: nowrap;
  }

  #progress {
    position: absolute;
    left: 800px;
    top: 268px;

    font-size: 92px;
    line-height: 1;
    font-weight: 700;
    white-space: nowrap;
  }

  #timer {
    position: absolute;
    left: 122px;
    top: 405px;

    font-size: 260px;
    line-height: .95;
    font-weight: 700;
    letter-spacing: 0;
    white-space: nowrap;

    text-shadow:
      0 0 8px rgba(255,255,255,.30),
      0 0 19px rgba(255,255,255,.18);
  }

  /* Absolutely NO HUD box/panel. */
  #hud, #hud::before, #hud::after {
    background-color: transparent;
  }
</style>
</head>

<body>

<div id="hud">
  <div id="title" class="white">PROJECT INDRAJEET</div>

  <div id="accentGlow"></div>
  <div id="accent"></div>

  <div id="day" class="white">DAY 1</div>
  <div id="progress" class="white">0 / 1000 H</div>

  <div id="timer" class="white">00:00:00</div>
</div>

<script>
(() => {
  const DESIGN_W = 1400;
  const DESIGN_H = 780;

  const params = new URLSearchParams(location.search);

  // LIVE VALUES
  const day = Math.max(1, parseInt(params.get("day") || "1", 10));
  const baseHours = Number(params.get("base") || "0");

  // Default SITTING calibration based on the fixed rooftop sitting frame:
  // same visual design as the renderer, but narrower because you sit closer.
  //
  // Order: TL, TR, BR, BL
  //
  // Standing renderer was roughly:
  // (0.045,.735) (0.455,.735) (0.545,.998) (0,.998)
  //
  // Sitting defaults below keep the same floor depth,
  // but pull the right edge inward so the HUD stops before your seated body.
  const Q = {
    tlx: getNum("tlx", 0.030),
    tly: getNum("tly", 0.740),

    trx: getNum("trx", 0.360),
    try: getNum("try", 0.740),

    brx: getNum("brx", 0.445),
    bry: getNum("bry", 0.997),

    blx: getNum("blx", 0.000),
    bly: getNum("bly", 0.997)
  };

  document.getElementById("day").textContent = `DAY ${day}`;

  function getNum(name, fallback) {
    const raw = params.get(name);
    if (raw === null || raw === "") return fallback;
    const n = Number(raw);
    return Number.isFinite(n) ? n : fallback;
  }

  function parseHMS(value) {
    if (!value) return 0;

    const p = String(value).trim().split(":").map(Number);
    if (p.some(v => !Number.isFinite(v))) return 0;

    if (p.length === 1) return p[0];
    if (p.length === 2) return p[0] * 60 + p[1];
    if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];

    return 0;
  }

  const initialElapsed = Math.max(0, parseHMS(params.get("start") || "0"));
  const loadedAt = performance.now();

  function formatHMS(seconds) {
    const s = Math.max(0, Math.floor(seconds + 1e-9));

    const hh = Math.floor(s / 3600);
    const mm = Math.floor((s % 3600) / 60);
    const ss = s % 60;

    return (
      String(hh).padStart(2, "0") + ":" +
      String(mm).padStart(2, "0") + ":" +
      String(ss).padStart(2, "0")
    );
  }

  function formatProgress(value) {
    // Same logic as the renderer:
    // max 2 decimals, remove trailing zeroes.
    let s = value.toFixed(2);
    s = s.replace(/\.?0+$/, "");
    return s;
  }

  function updateClock() {
    const elapsed =
      initialElapsed +
      (performance.now() - loadedAt) / 1000;

    document.getElementById("timer").textContent =
      formatHMS(elapsed);

    document.getElementById("progress").textContent =
      `${formatProgress(baseHours + elapsed / 3600)} / 1000 H`;
  }

  // ---- TRUE 4-CORNER FLOOR PROJECTION ----
  //
  // This is the browser equivalent of the Python renderer's homography.
  // It maps the exact 1400x780 HUD canvas into the sitting-floor quadrilateral.
  function applyProjection() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    const p0 = [Q.tlx * w, Q.tly * h]; // top-left
    const p1 = [Q.trx * w, Q.try * h]; // top-right
    const p2 = [Q.brx * w, Q.bry * h]; // bottom-right
    const p3 = [Q.blx * w, Q.bly * h]; // bottom-left

    const H = squareToQuad(p0, p1, p2, p3);

    // Convert unit-square homography into source-pixel homography.
    const h11 = H.a / DESIGN_W;
    const h12 = H.b / DESIGN_H;
    const h13 = H.c;

    const h21 = H.d / DESIGN_W;
    const h22 = H.e / DESIGN_H;
    const h23 = H.f;

    const h31 = H.g / DESIGN_W;
    const h32 = H.h / DESIGN_H;

    // CSS matrix3d is column-major.
    const matrix = [
      h11, h21, 0, h31,
      h12, h22, 0, h32,
      0,   0,   1, 0,
      h13, h23, 0, 1
    ];

    document.getElementById("hud").style.transform =
      `matrix3d(${matrix.join(",")})`;
  }

  function squareToQuad(p0, p1, p2, p3) {
    const [x0,y0] = p0;
    const [x1,y1] = p1;
    const [x2,y2] = p2;
    const [x3,y3] = p3;

    const dx1 = x1 - x2;
    const dx2 = x3 - x2;
    const dx3 = x0 - x1 + x2 - x3;

    const dy1 = y1 - y2;
    const dy2 = y3 - y2;
    const dy3 = y0 - y1 + y2 - y3;

    let g = 0;
    let h = 0;

    if (Math.abs(dx3) > 1e-9 || Math.abs(dy3) > 1e-9) {
      const den = dx1 * dy2 - dx2 * dy1;

      g = (dx3 * dy2 - dx2 * dy3) / den;
      h = (dx1 * dy3 - dx3 * dy1) / den;
    }

    return {
      a: x1 - x0 + g * x1,
      b: x3 - x0 + h * x3,
      c: x0,

      d: y1 - y0 + g * y1,
      e: y3 - y0 + h * y3,
      f: y0,

      g,
      h
    };
  }

  updateClock();
  applyProjection();

  // Timer can update frequently; visible HH:MM:SS changes once per second.
  setInterval(updateClock, 200);

  window.addEventListener("resize", applyProjection);
})();
</script>

</body>
</html>
