<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Indrajeet — Responsive Carpet V2</title>

<style>
  :root{
    --white:#ffffff;
    --cyan:#22e8ff;
    --violet:#9c58ff;
    --pink:#ff46d8;
    --orange:#ff9c24;
    --gold:#ffd34d;
    --glow:1.45;
    --bg:.20;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent !important;
    font-family:Arial,Helvetica,sans-serif;
  }

  /* PRISM may give us any viewport.
     This stage simply centers one fixed-proportion design inside it. */
  #stage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:transparent;
  }

  /* Outer wrapper is ONLY for auto-fit scaling. */
  #fit{
    width:1240px;
    height:620px;
    flex:0 0 auto;
    transform-origin:center center;
  }

  /* The actual luminous "carpet". Its proportions never change. */
  #carpet{
    position:relative;
    width:1240px;
    height:620px;

    padding:48px 58px 50px;

    color:var(--white);

    transform-origin:center center;
    transform:
      perspective(1150px)
      rotateX(42deg)
      rotateZ(-2deg);

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,calc(var(--bg) * .72)),
        rgba(255,255,255,calc(var(--bg) * .22))
      );

    border-radius:34px;

    box-shadow:
      0 0 calc(34px * var(--glow))
        rgba(255,255,255,calc(var(--bg) * .38)),
      0 0 calc(80px * var(--glow))
        rgba(34,232,255,calc(var(--bg) * .18));

    isolation:isolate;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
  }

  /* Soft coloured light on the "floor". */
  #carpet::before{
    content:"";
    position:absolute;
    z-index:-1;

    left:38px;
    right:38px;
    bottom:24px;
    height:270px;

    border-radius:50%;

    background:
      radial-gradient(ellipse at 13% 52%,
        rgba(34,232,255,.32) 0%,
        rgba(34,232,255,.13) 27%,
        rgba(34,232,255,0) 58%),
      radial-gradient(ellipse at 45% 52%,
        rgba(156,88,255,.28) 0%,
        rgba(156,88,255,.12) 28%,
        rgba(156,88,255,0) 60%),
      radial-gradient(ellipse at 72% 52%,
        rgba(255,70,216,.21) 0%,
        rgba(255,70,216,.09) 24%,
        rgba(255,70,216,0) 56%),
      radial-gradient(ellipse at 91% 52%,
        rgba(255,156,36,.24) 0%,
        rgba(255,156,36,.10) 22%,
        rgba(255,156,36,0) 54%);

    filter:blur(calc(26px * var(--glow)));
    pointer-events:none;
  }

  .title{
    font-size:76px;
    line-height:.96;
    font-weight:900;
    letter-spacing:12px;
    white-space:nowrap;

    text-shadow:
      0 0 calc(10px * var(--glow)) rgba(255,255,255,.98),
      0 0 calc(22px * var(--glow)) rgba(34,232,255,.24),
      0 3px 5px rgba(0,0,0,.28);
  }

  .accent{
    width:100%;
    height:8px;
    margin:24px 0 34px;

    border-radius:999px;

    background:
      linear-gradient(
        90deg,
        var(--cyan) 0%,
        var(--violet) 33%,
        var(--pink) 59%,
        var(--orange) 83%,
        var(--gold) 100%
      );

    box-shadow:
      0 0 calc(12px * var(--glow)) rgba(34,232,255,.84),
      0 0 calc(24px * var(--glow)) rgba(156,88,255,.38),
      0 0 calc(28px * var(--glow)) rgba(255,156,36,.23);
  }

  .meta{
    width:100%;

    display:flex;
    align-items:baseline;
    justify-content:space-between;

    font-size:72px;
    line-height:1;
    font-weight:900;
    white-space:nowrap;

    text-shadow:
      0 0 calc(9px * var(--glow)) rgba(255,255,255,.94),
      0 0 calc(18px * var(--glow)) rgba(34,232,255,.14),
      0 3px 5px rgba(0,0,0,.24);
  }

  .time{
    margin-top:50px;

    width:100%;
    font-size:225px;
    line-height:.82;
    font-weight:900;
    letter-spacing:1px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;

    /* Keeps timer inside same visual width as the text above. */
    transform:scaleX(.84);
    transform-origin:left center;

    text-shadow:
      0 0 calc(14px * var(--glow)) rgba(255,255,255,1),
      0 0 calc(30px * var(--glow)) rgba(34,232,255,.40),
      0 0 calc(46px * var(--glow)) rgba(156,88,255,.17),
      0 4px 6px rgba(0,0,0,.18);
  }
</style>
</head>

<body>
<div id="stage">
  <div id="fit">
    <div id="carpet">
      <div class="title">PROJECT INDRAJEET</div>
      <div class="accent"></div>

      <div class="meta">
        <div>DAY <span id="day">1</span></div>
        <div><span id="progress">0</span> / 1000 H</div>
      </div>

      <div class="time" id="elapsed">00:00:00</div>
    </div>
  </div>
</div>

<script>
(() => {
  const q = new URLSearchParams(location.search);

  const fit = document.getElementById("fit");
  const carpet = document.getElementById("carpet");
  const root = document.documentElement;

  function num(name,fallback,min,max){
    const n=parseFloat(q.get(name));
    if(!Number.isFinite(n)) return fallback;
    return Math.max(min,Math.min(max,n));
  }

  /* ---------------- CONTENT ---------------- */

  const d=parseInt(q.get("day") || "1",10);
  document.getElementById("day").textContent =
    Number.isFinite(d) && d>0 ? String(d) : "1";

  const b=parseFloat(q.get("base") || "0");
  const base=Number.isFinite(b) && b>=0 ? b : 0;

  /* ---------------- LOOK ---------------- */

  const tilt=num("tilt",42,20,65);
  const roll=num("roll",-2,-15,15);
  const perspective=num("perspective",1150,500,2500);
  const fill=num("fill",.94,.50,1);
  const glow=num("glow",1.45,0,4);
  const bg=num("bgopacity",.20,0,.65);

  root.style.setProperty("--glow",glow);
  root.style.setProperty("--bg",bg);

  carpet.style.transform =
    `perspective(${perspective}px)
     rotateX(${tilt}deg)
     rotateZ(${roll}deg)`;

  /* ---------------- TRUE RESPONSIVE FIT ----------------
     Measure the transformed carpet, then scale the wrapper
     so the WHOLE thing fits inside the current viewport.
     This works in portrait Chrome and landscape PRISM.
  ------------------------------------------------------ */

  function autoFit(){
    fit.style.transform="scale(1)";

    requestAnimationFrame(()=>{
      const r=carpet.getBoundingClientRect();

      const vw=window.innerWidth;
      const vh=window.innerHeight;

      const sx=(vw * fill) / r.width;
      const sy=(vh * fill) / r.height;

      const s=Math.min(sx,sy);

      fit.style.transform=`scale(${s})`;
    });
  }

  window.addEventListener("resize",autoFit);
  autoFit();
  setTimeout(autoFit,100);
  setTimeout(autoFit,500);

  /* ---------------- TIMER ---------------- */

  function getStart(){
    const supplied=q.get("start");

    if(!supplied) return Date.now();

    const p=supplied.split(":").map(Number);

    if(p.length<2 || p.some(v=>!Number.isFinite(v))){
      return Date.now();
    }

    const now=new Date();

    const h=Math.max(0,Math.min(23,p[0]));
    const m=Math.max(0,Math.min(59,p[1]));
    const s=Math.max(0,Math.min(59,p[2] || 0));

    return new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      h,m,s,0
    ).getTime();
  }

  const started=getStart();

  function formatTime(seconds){
    seconds=Math.max(0,Math.floor(seconds));

    const h=Math.floor(seconds/3600);
    const m=Math.floor((seconds%3600)/60);
    const s=seconds%60;

    return (
      String(h).padStart(2,"0")+":"+
      String(m).padStart(2,"0")+":"+
      String(s).padStart(2,"0")
    );
  }

  function formatProgress(hours){
    const n=Math.round(hours*100)/100;
    return String(parseFloat(n.toFixed(2)));
  }

  function tick(){
    const sec=Math.max(0,(Date.now()-started)/1000);

    document.getElementById("elapsed").textContent=
      formatTime(sec);

    document.getElementById("progress").textContent=
      formatProgress(
        Math.min(1000,base+sec/3600)
      );
  }

  tick();
  setInterval(tick,250);

  /* Optional browser preview background:
     add &preview=1 to see it against dark gray in Chrome.
     PRISM should use the normal transparent version. */
  if(q.get("preview")==="1"){
    document.body.style.background="#5d6065";
  }
})();
</script>
</body>
</html>
