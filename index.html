<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Indrajeet — Deep Carpet Overlay</title>
<style>
  :root{
    --white:#ffffff;
    --muted:rgba(255,255,255,.97);

    --cyan:#26e7ff;
    --violet:#9b59ff;
    --pink:#ff48db;
    --orange:#ff9d24;
    --gold:#ffd34f;

    --glowStrength:1.55;
    --backingOpacity:.22;
  }

  html, body{
    margin:0;
    padding:0;
    background:transparent !important;
    overflow:visible;
    font-family:Arial, Helvetica, sans-serif;
  }

  /* Taller, less banner-like canvas */
  body{
    width:1420px;
    height:980px;
    background:transparent !important;
  }

  #page{
    position:relative;
    width:1420px;
    height:980px;
    background:transparent !important;
    overflow:visible;
  }

  #floorOverlay{
    position:absolute;
    left:18px;
    bottom:20px;
    width:1340px;
    color:var(--white);
    background:transparent !important;

    transform-origin:left bottom;

    /* less flattening = more visible carpet depth */
    transform:
      scale(1)
      perspective(980px)
      rotateX(49deg)
      rotateZ(-2deg);

    opacity:.995;
    isolation:isolate;
    backface-visibility:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
  }

  /* deep translucent carpet */
  #floorOverlay::before{
    content:"";
    position:absolute;
    left:-36px;
    top:-40px;
    width:1280px;
    height:800px;
    border-radius:38px;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,calc(var(--backingOpacity) * .72)),
        rgba(255,255,255,calc(var(--backingOpacity) * .26))
      );

    box-shadow:
      0 0 64px rgba(255,255,255,calc(var(--backingOpacity) * .34)),
      0 0 120px rgba(255,255,255,calc(var(--backingOpacity) * .14)),
      inset 0 0 1px rgba(255,255,255,.30);

    filter:blur(1.4px);
    z-index:-4;
    pointer-events:none;
  }

  /* broader glow spread across the full carpet depth */
  #floorOverlay::after{
    content:"";
    position:absolute;
    left:-10px;
    top:330px;
    width:1180px;
    height:380px;
    border-radius:50%;

    background:
      radial-gradient(ellipse at 12% 45%,
        rgba(38,231,255,.31) 0%,
        rgba(38,231,255,.16) 25%,
        rgba(38,231,255,0) 56%),

      radial-gradient(ellipse at 44% 50%,
        rgba(155,89,255,.27) 0%,
        rgba(155,89,255,.13) 26%,
        rgba(155,89,255,0) 58%),

      radial-gradient(ellipse at 70% 54%,
        rgba(255,72,219,.21) 0%,
        rgba(255,72,219,.11) 22%,
        rgba(255,72,219,0) 55%),

      radial-gradient(ellipse at 92% 56%,
        rgba(255,157,36,.23) 0%,
        rgba(255,157,36,.11) 20%,
        rgba(255,157,36,0) 52%);

    filter:blur(40px);
    z-index:-3;
    pointer-events:none;
  }

  .title{
    font-size:88px;
    line-height:1;
    font-weight:800;
    letter-spacing:14px;
    text-transform:uppercase;
    white-space:nowrap;

    text-shadow:
      0 0 calc(14px * var(--glowStrength)) rgba(255,255,255,.99),
      0 0 calc(26px * var(--glowStrength)) rgba(38,231,255,.22),
      0 4px 6px rgba(0,0,0,.22);
  }

  .accent{
    width:1080px;
    height:9px;
    margin:32px 0 44px;
    border-radius:999px;

    background:linear-gradient(
      90deg,
      var(--cyan) 0%,
      var(--violet) 34%,
      var(--pink) 58%,
      var(--orange) 82%,
      var(--gold) 100%
    );

    box-shadow:
      0 0 calc(18px * var(--glowStrength)) rgba(38,231,255,.82),
      0 0 calc(30px * var(--glowStrength)) rgba(155,89,255,.38),
      0 0 calc(34px * var(--glowStrength)) rgba(255,157,36,.24);
  }

  .meta{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    width:1120px;

    font-size:96px;
    line-height:1;
    font-weight:800;
    letter-spacing:2px;
    color:var(--muted);
    white-space:nowrap;

    text-shadow:
      0 0 calc(12px * var(--glowStrength)) rgba(255,255,255,.94),
      0 0 calc(22px * var(--glowStrength)) rgba(38,231,255,.14),
      0 4px 6px rgba(0,0,0,.20);
  }

  .meta strong{
    color:var(--white);
    font-weight:900;
  }

  /* Big, but contained under the block above */
  .time{
    margin-top:64px;
    width:1120px;

    font-size:255px;
    line-height:.90;
    font-weight:900;
    letter-spacing:2px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;

    transform:scaleX(.94);
    transform-origin:left center;

    text-shadow:
      0 0 calc(20px * var(--glowStrength)) rgba(255,255,255,.998),
      0 0 calc(36px * var(--glowStrength)) rgba(38,231,255,.38),
      0 0 calc(50px * var(--glowStrength)) rgba(155,89,255,.15),
      0 4px 6px rgba(0,0,0,.16);
  }
</style>
</head>

<body>
  <div id="page">
    <div id="floorOverlay">
      <div class="title">PROJECT INDRAJEET</div>
      <div class="accent"></div>

      <div class="meta">
        <div>DAY <strong id="day">1</strong></div>
        <div><strong id="progress">0</strong> / 1000 H</div>
      </div>

      <div class="time" id="elapsed">00:00:00</div>
    </div>
  </div>

<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const floor = document.getElementById("floorOverlay");
  const root = document.documentElement;
  const body = document.body;
  const page = document.getElementById("page");

  function numberParam(name, fallback, min, max){
    const raw = parseFloat(params.get(name));
    if (!Number.isFinite(raw)) return fallback;
    return Math.max(min, Math.min(max, raw));
  }

  const dayRaw = parseInt(params.get("day") || "1", 10);
  const day = Number.isFinite(dayRaw) && dayRaw > 0 ? dayRaw : 1;

  const baseRaw = parseFloat(params.get("base") || "0");
  const baseHours = Number.isFinite(baseRaw) && baseRaw >= 0 ? baseRaw : 0;

  document.getElementById("day").textContent = String(day);

  /* Deep-carpet geometry defaults */
  const tilt = numberParam("tilt", 49, 20, 75);
  const roll = numberParam("roll", -2, -20, 20);
  const perspective = numberParam("perspective", 980, 300, 2200);
  const opacity = numberParam("opacity", 0.995, 0.2, 1);
  const size = numberParam("size", 1, 0.4, 2.0);

  floor.style.transform =
    `scale(${size}) perspective(${perspective}px) rotateX(${tilt}deg) rotateZ(${roll}deg)`;

  floor.style.opacity = opacity;

  const backing = numberParam("bgopacity", 0.22, 0, 0.7);
  const glow = numberParam("glow", 1.55, 0, 4);

  root.style.setProperty("--backingOpacity", backing);
  root.style.setProperty("--glowStrength", glow);

  function fitPageToContent(){
    const rect = floor.getBoundingClientRect();
    const w = Math.ceil(rect.width + 90);
    const h = Math.ceil(rect.height + 90);

    body.style.width = w + "px";
    body.style.height = h + "px";

    page.style.width = w + "px";
    page.style.height = h + "px";
  }

  function getStartMs(){
    const startParam = params.get("start");

    if (!startParam){
      return Date.now();
    }

    const parts = startParam.split(":").map(Number);

    if (parts.length < 2 || parts.some(v => !Number.isFinite(v))){
      return Date.now();
    }

    const now = new Date();

    const h = Math.max(0, Math.min(23, parts[0]));
    const m = Math.max(0, Math.min(59, parts[1]));
    const s = Math.max(0, Math.min(59, parts[2] || 0));

    return new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      h, m, s, 0
    ).getTime();
  }

  const startMs = getStartMs();

  function formatElapsed(totalSeconds){
    totalSeconds = Math.max(0, Math.floor(totalSeconds));

    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;

    return (
      String(h).padStart(2, "0") + ":" +
      String(m).padStart(2, "0") + ":" +
      String(s).padStart(2, "0")
    );
  }

  function formatProgress(hours){
    const rounded = Math.round(hours * 100) / 100;
    return String(parseFloat(rounded.toFixed(2)));
  }

  function update(){
    const elapsedSeconds = Math.max(0, (Date.now() - startMs) / 1000);

    document.getElementById("elapsed").textContent =
      formatElapsed(elapsedSeconds);

    const liveProgress = Math.min(
      1000,
      baseHours + elapsedSeconds / 3600
    );

    document.getElementById("progress").textContent =
      formatProgress(liveProgress);
  }

  update();
  fitPageToContent();
  setInterval(update, 250);

  setTimeout(fitPageToContent, 350);
  setTimeout(fitPageToContent, 1000);
})();
</script>
</body>
</html>
